<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北九州加盟店マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #fffaf9; --card-bg: #ffffff; --text-main: #5d4037; --text-sub: #9e8580;
            --primary: #ff6b6b; --primary-light: #fff0f0; --primary-dark: #ee5253;
            --accent: #48cfad; --accent-bg: #e0f2f1; --border: #ffE4e1;
            --shadow: 0 4px 15px rgba(255, 107, 107, 0.15);
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background: var(--bg-color); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        #app { display: flex; flex-direction: column; height: 100%; position: relative; overflow: hidden; }
        
        header { background: rgba(255, 255, 255, 0.95); height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 2px 10px rgba(255, 107, 107, 0.1); z-index: 1001; backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
        .header-title { font-weight: bold; font-size: 17px; letter-spacing: 0.05em; }
        .menu-btn { font-size: 24px; color: var(--primary); cursor: pointer; border: none; background: none; padding: 8px; }

        #category-filter { padding: 15px 20px; background: var(--bg-color); white-space: nowrap; overflow-x: auto; z-index: 999; display: flex; gap: 10px; scrollbar-width: none; }
        #category-filter::-webkit-scrollbar { display: none; }
        .filter-chip { padding: 8px 18px; border-radius: 20px; background: #fff; font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; border: 2px solid var(--border); box-shadow: 0 2px 4px rgba(255, 100, 100, 0.05); flex-shrink: 0; transition: all 0.3s ease; }
        .filter-chip.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3); transform: translateY(-2px); }

        #content-area { flex: 1; position: relative; overflow: hidden; }
        #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
        #list-view { width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: var(--bg-color); z-index: 0; overflow-y: auto; padding: 20px; box-sizing: border-box; display: none; padding-bottom: 80px; }

        .card { background: var(--card-bg); border-radius: 16px; margin-bottom: 24px; box-shadow: var(--shadow); overflow: hidden; }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #fff0f0; display: block; cursor: pointer; }
        
        .detail-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .detail-slider::-webkit-scrollbar { display: none; }
        .detail-slide-item { min-width: 100%; scroll-snap-align: start; }
        .detail-slide-img { width: 100%; height: 250px; object-fit: cover; display: block; cursor: pointer; }

        .card-body { padding: 24px; }
        .card-cat { display: inline-block; font-size: 11px; font-weight: bold; color: var(--primary-dark); background: var(--primary-light); padding: 6px 14px; border-radius: 20px; margin-bottom: 12px; letter-spacing: 0.05em; }
        .card h3 { margin: 0 0 15px 0; font-size: 18px; line-height: 1.5; }
        .info-row { display: flex; align-items: flex-start; margin-bottom: 10px; font-size: 14px; }
        .info-icon { width: 24px; color: var(--primary); text-align: center; margin-right: 12px; font-size: 16px; margin-top: 1px; }
        .info-content { flex: 1; line-height: 1.7; }
        .info-link { color: var(--accent); text-decoration: none; border-bottom: 2px solid var(--accent-bg); padding-bottom: 1px; font-weight: bold; }

        .card-actions { display: flex; gap: 12px; margin-top: 24px; border-top: 2px dashed var(--border); padding-top: 18px; flex-wrap: wrap; }
        .btn-action { flex: 1; min-width: 120px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 12px; text-decoration: none; font-size: 13px; font-weight: bold; }
        .btn-route { background: #fff; color: var(--text-main); border: 2px solid var(--border); }
        .btn-web { background: var(--accent-bg); color: var(--accent); }
        .btn-sns { background: #fdf2f8; color: #db2777; }

        /* クーポンデザイン（画像とボタンを確実に表示） */
        .coupon-area { background: #fff; border: 2px dashed var(--primary); border-radius: 12px; padding: 16px; margin-top: 24px; }
        .coupon-title { font-size: 12px; font-weight: bold; color: var(--primary); margin-bottom: 12px; display: block; letter-spacing: 0.05em; }
        .coupon-slider { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
        .coupon-item { 
            width: 280px; /* 幅固定 */
            background: white; border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.1); 
            border: 1px solid var(--primary-light); 
            overflow: hidden; flex-shrink: 0; scroll-snap-align: center; 
            display: flex; flex-direction: column; 
        }
        /* 画像：高さ固定でスペース確保 */
        .coupon-thumb { 
            width: 100%; height: 180px; 
            object-fit: cover; background: #fff; cursor: pointer; display: block; 
        }
        /* ボタン：画像の下に配置 */
        .coupon-btn { 
            display: block; background: var(--primary); color: white; text-align: center; padding: 12px; text-decoration: none; font-weight: bold; font-size: 13px; letter-spacing: 0.05em; 
        }
        .coupon-btn.disabled { background: #e0e0e0; color: #aaa; pointer-events: none; }

        .leaflet-popup-content-wrapper { padding: 0; border-radius: 16px; overflow: hidden; box-shadow: 0 5px 25px rgba(255, 107, 107, 0.2); }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .popup-img { width: 100%; height: 140px; object-fit: cover; background: #fff0f0; }
        .popup-body { padding: 16px; }
        .popup-title { font-weight: bold; font-size: 16px; display: block; margin-bottom: 8px; margin-top: 8px; }
        .popup-meta { font-size: 13px; display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; line-height: 1.5; }
        .popup-meta i { width: 16px; text-align: center; color: var(--primary); margin-top: 3px; }
        .popup-cat { display: inline-block; font-size: 10px; font-weight: bold; color: var(--primary-dark); background: var(--primary-light); padding: 4px 10px; border-radius: 15px; letter-spacing: 0.05em; }

        #drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(93, 64, 55, 0.2); backdrop-filter: blur(2px); z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s; }
        #drawer { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #fff; z-index: 2001; transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; box-shadow: 4px 0 20px rgba(255, 107, 107, 0.1); }
        .drawer-header { padding: 30px 20px; background: var(--primary-light); font-weight: bold; border-bottom: 1px solid var(--border); font-size: 18px; color: var(--primary-dark); }
        .search-box { padding: 20px; background: #fff; border-bottom: 1px solid #fffaf9; }
        .search-input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 12px; box-sizing: border-box; font-size: 14px; background: #fff; }
        .search-input:focus { border-color: var(--primary); outline: none; }
        .drawer-item { padding: 18px 24px; border-bottom: 1px solid #f9f9f9; cursor: pointer; display: flex; align-items: center; font-size: 14px; }
        .drawer-item i { width: 32px; color: var(--primary); font-size: 18px; }
        .drawer-footer { margin-top: auto; padding: 20px; font-size: 11px; text-align: center; color: #aaa; background: #fff; }

        #detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: 2500; display: none; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; backdrop-filter: blur(5px); }
        #detail-content { width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; border-radius: 20px; position: relative; box-shadow: 0 15px 50px rgba(255, 107, 107, 0.2); scrollbar-width: none; -ms-overflow-style: none; }
        #detail-content::-webkit-scrollbar { display: none; }
        #detail-close-btn { position: absolute; top: 20px; right: 20px; z-index: 10; background: rgba(255,255,255,0.9); color: var(--primary); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        #image-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(50, 40, 30, 0.95); z-index: 3000; display: none; align-items: center; justify-content: center; }
        #image-modal img { max-width: 95%; max-height: 95%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        #modal-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 34px; cursor: pointer; padding: 20px; }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <button class="menu-btn" onclick="openDrawer()"><i class="fa-solid fa-bars"></i></button>
            <div class="header-title">北九州加盟店マップ</div>
            <button class="menu-btn" onclick="toggleView()" id="header-toggle-icon"><i class="fa-solid fa-list"></i></button>
        </header>
        <div id="category-filter"></div>
        <div id="content-area"><div id="map"></div><div id="list-view"></div></div>
    </div>
    <div id="detail-modal" onclick="closeDetailModal(event)"><div id="detail-content"></div></div>
    <div id="drawer-overlay" onclick="closeDrawer()"></div>
    <div id="drawer">
        <div class="drawer-header">Menu</div>
        <div class="search-box">
            <input type="text" class="search-input" id="keyword-search" placeholder="店名、住所、ジャンルなど..." oninput="filterData()">
        </div>
        <div class="drawer-item" onclick="getMyLocation(); closeDrawer();"><i class="fa-solid fa-location-crosshairs"></i> 現在地を表示</div>
        <div class="drawer-item" onclick="toggleView(); closeDrawer();"><i class="fa-solid fa-list" id="drawer-toggle-icon"></i> <span id="drawer-toggle-text">加盟店一覧を表示</span></div>
        <div class="drawer-item" onclick="location.reload();" style="margin-top:10px; border-top:1px solid #eee;"><i class="fa-solid fa-rotate"></i> データを更新</div>
        <div class="drawer-footer">Map Data © OpenStreetMap, © CARTO</div>
    </div>
    <div id="image-modal" onclick="this.style.display='none'"><span id="modal-close">×</span><img id="modal-img" src=""></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxlqdGFsGAteMhVTA63JdGK3L_ySKgBP3SsOTLBvRoRnsisttyE3c5WJpkEcps51YCtqw/exec"; 

        let map, allData = [], filteredData = [], markers = [], isMapView = true, currentCategory = 'all';

        window.onload = function() { initMap(); fetchData(); };

        function initMap() {
            const layer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap contributors © CARTO', maxZoom: 20 });
            map = L.map('map', { zoomControl: false }).setView([33.8833, 130.8750], 12);
            layer.addTo(map);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
        }

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Error");
                allData = await res.json();
                if(!allData || allData.length === 0) { useMockData(); return; }
                initData(allData);
            } catch (e) { useMockData(); }
        }

        function initData(data) {
            allData = data; filteredData = data;
            generateCategoryFilter(allData); renderData(allData);
            if(markers.length > 0) { const group = new L.featureGroup(markers); map.fitBounds(group.getBounds()); }
        }

        function filterData() {
            const keyword = document.getElementById('keyword-search').value.toLowerCase();
            filteredData = allData.filter(item => {
                const catMatch = currentCategory === 'all' || item.category === currentCategory;
                const targetText = ((item.name||"")+(item.description||"")+(item.category||"")+(item.tel||"")+(item.address||"")).toLowerCase();
                return catMatch && (!keyword || targetText.includes(keyword));
            });
            renderData(filteredData);
        }

     // ★Googleドライブ画像を強制表示させる強力な変換機能
        function formatImageUrl(url) {
            if(!url) return 'https://placehold.jp/300x200.png?text=No+Image';
            let clean = url.trim();
            
            // GoogleドライブのID抽出 (d/xxxxx/ または id=xxxxx)
            const idMatch = clean.match(/\/d\/(.+?)\/|id=(.+?)(&|$)/);
            
            if(clean.includes("drive.google") && idMatch) {
                const id = idMatch[1] || idMatch[2];
                // ★ここがポイント：ブロックされにくい魔法のドメイン「lh3」を使う
                return `https://lh3.googleusercontent.com/d/${id}`;
            }
            return clean;
        }

        function renderData(data) {
            markers.forEach(m => map.removeLayer(m)); markers = [];
            const list = document.getElementById('list-view'); list.innerHTML = "";
            if(data.length === 0) { list.innerHTML = '<div style="text-align:center; padding:40px; color:#aaa;">該当する店舗が見つかりません</div>'; return; }

            data.forEach(shop => {
                const shopImgs = shop.image ? shop.image.split(',') : [];
                const mainImg = formatImageUrl(shopImgs[0]);

                if(shop.lat && shop.lng) {
                    const marker = L.marker([shop.lat, shop.lng]).addTo(map);
                    marker.bindPopup(`<div>
                        <img src="${mainImg}" class="popup-img" referrerpolicy="no-referrer">
                        <div class="popup-body">
                            <span class="popup-cat">${shop.category}</span>
                            <span class="popup-title">${shop.name}</span>
                            <div class="popup-meta"><i class="fa-solid fa-location-dot"></i> ${shop.address || '住所なし'}</div>
                            <div class="popup-meta"><i class="fa-regular fa-clock"></i> ${shop.hours || '営業情報なし'}</div>
                            <div class="popup-meta"><i class="fa-solid fa-ban"></i> ${shop.closed ? '定休: '+shop.closed : '定休なし'}</div>
                            <button onclick="openDetailModal(${shop.id})" style="width:100%; margin-top:10px; padding:8px; background:var(--primary); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">詳細を表示</button>
                        </div>
                    </div>`);
                    markers.push(marker);
                }
                const card = document.createElement('div'); card.className = 'card'; card.id = `shop-${shop.id}`;
                card.innerHTML = createCardHTML(shop, mainImg); list.appendChild(card);
            });
        }

        function createCardHTML(shop, imgUrl, isDetail = false) {
            const row = (icon, text) => text ? `<div class="info-row"><div class="info-icon"><i class="${icon}"></i></div><div class="info-content">${text}</div></div>` : '';
            const addr = row("fa-solid fa-location-dot", shop.address);
            const tel = shop.tel ? `<div class="info-row"><div class="info-icon"><i class="fa-solid fa-phone"></i></div><div class="info-content"><a href="tel:${shop.tel}" class="info-link">${shop.tel}</a></div></div>` : '';
            const hours = row("fa-regular fa-clock", shop.hours);
            const closed = row("fa-solid fa-ban", shop.closed ? "定休: " + shop.closed : "");
            const url = shop.url ? `<div class="info-row"><div class="info-icon"><i class="fa-solid fa-globe"></i></div><div class="info-content"><a href="${shop.url}" target="_blank" class="info-link">公式サイト</a></div></div>` : '';

            let imgSec = '';
            const shopImgs = shop.image ? shop.image.split(',').filter(s => s.trim()) : [];
            if (isDetail && shopImgs.length > 1) {
                let slides = '';
                shopImgs.forEach(src => {
                    const cSrc = formatImageUrl(src);
                    slides += `<div class="detail-slide-item"><img src="${cSrc}" class="detail-slide-img" referrerpolicy="no-referrer" onclick="openImageModal('${cSrc}')"></div>`;
                });
                imgSec = `<div style="position:relative"><div class="detail-slider">${slides}</div></div>`;
            } else {
                imgSec = `<img src="${imgUrl}" class="card-img" referrerpolicy="no-referrer" onclick="openImageModal('${imgUrl}')">`;
            }

            let couponHtml = '';
            if (shop.coupon_imgs) {
                const imgList = shop.coupon_imgs.split(',');
                const urlList = (shop.coupon_urls || "").split(',');
                let slides = '';
                imgList.forEach((img, i) => {
                    const cImg = formatImageUrl(img);
                    const cUrl = urlList[i] ? urlList[i].trim() : "";
                    const btn = cUrl 
                        ? `<a href="${cUrl}" target="_blank" class="coupon-btn">クーポンを使う</a>` 
                        : `<span class="coupon-btn disabled">クーポンなし</span>`;
                    slides += `<div class="coupon-item"><img src="${cImg}" class="coupon-thumb" referrerpolicy="no-referrer" onclick="openImageModal('${cImg}')">${btn}</div>`;
                });
                if(slides) couponHtml = `<div class="coupon-area"><span class="coupon-title"><i class="fa-solid fa-gift"></i> お得なクーポン${imgList.length>1?" (横にスライド)":""}</span><div class="coupon-slider">${slides}</div></div>`;
            } else if(shop.coupon_url) {
                couponHtml = `<div class="coupon-area"><span class="coupon-title"><i class="fa-solid fa-gift"></i> お得なクーポン</span><a href="${shop.coupon_url}" target="_blank" class="coupon-btn">クーポンを使う</a></div>`;
            }

            const route = (shop.lat && shop.lng) ? `https://www.google.com/maps/dir/?api=1&destination=${shop.lat},${shop.lng}` : "";

            return `
                ${imgSec}
                <div class="card-body">
                    <span class="card-cat">${shop.category}</span>
                    <h3>${shop.name}</h3>
                    <div style="margin-bottom:20px;">${addr}${tel}${hours}${closed}${url}</div>
                    <div style="font-size:14px; color:var(--text-sub); line-height:1.7;">${shop.description || '詳細情報なし'}</div>
                    ${couponHtml}
                    <div class="card-actions">
                        ${route ? `<a href="${route}" target="_blank" class="btn-action btn-route"><i class="fa-solid fa-location-arrow"></i> ルート案内</a>` : ''}
                        ${shop.url ? `<a href="${shop.url}" target="_blank" class="btn-action btn-web"><i class="fa-solid fa-arrow-up-right-from-square"></i> WEB</a>` : ''}
                        ${shop.sns ? `<a href="${shop.sns}" target="_blank" class="btn-action btn-sns"><i class="fa-brands fa-instagram"></i> SNS</a>` : ''}
                    </div>
                </div>
            `;
        }

        window.openDetailModal = function(id) {
            const shop = allData.find(s => s.id == id); if (!shop) return;
            const shopImgs = shop.image ? shop.image.split(',') : [];
            const mainImg = formatImageUrl(shopImgs[0]);
            const html = createCardHTML(shop, mainImg, true);
            const content = document.getElementById('detail-content');
            content.innerHTML = `<div id="detail-close-btn" onclick="document.getElementById('detail-modal').style.display='none'">×</div><div class="card" style="margin-bottom:0; box-shadow:none; border:none; border-radius:16px;">${html}</div>`;
            document.getElementById('detail-modal').style.display = 'flex';
        }
        window.closeDetailModal = function(e) { if(e.target.id === 'detail-modal') { document.getElementById('detail-modal').style.display = 'none'; } }

        function generateCategoryFilter(data) {
            const categories = [...new Set(data.map(item => item.category).filter(c => c))];
            if (categories.indexOf("その他") > -1) { categories.splice(categories.indexOf("その他"), 1); categories.push("その他"); }
            const container = document.getElementById('category-filter');
            container.innerHTML = '<div class="filter-chip active" onclick="filterCategory(\'all\', this)">すべて</div>';
            categories.forEach(cat => {
                const chip = document.createElement('div'); chip.className = 'filter-chip'; chip.innerText = cat;
                chip.onclick = function() { filterCategory(cat, this); }; container.appendChild(chip);
            });
        }
        function filterCategory(cat, el) {
            currentCategory = cat; document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); filterData();
        }
        function toggleView(forceList = null) {
            const mapEl = document.getElementById('map'), listEl = document.getElementById('list-view');
            const icon = document.querySelector('#header-toggle-icon i'), dIcon = document.getElementById('drawer-toggle-icon'), dText = document.getElementById('drawer-toggle-text');
            const nextState = forceList !== null ? !forceList : !isMapView;
            if (!nextState) { 
                mapEl.style.zIndex = 0; listEl.style.display = 'block'; listEl.style.zIndex = 1;
                icon.className = "fa-solid fa-map"; if(dIcon) dIcon.className = "fa-solid fa-map"; if(dText) dText.innerText = "地図を表示";
                isMapView = false;
            } else { 
                mapEl.style.zIndex = 1; listEl.style.display = 'none'; listEl.style.zIndex = 0;
                icon.className = "fa-solid fa-list"; if(dIcon) dIcon.className = "fa-solid fa-list"; if(dText) dText.innerText = "加盟店一覧を表示";
                isMapView = true; setTimeout(() => map.invalidateSize(), 100);
            }
        }
        function openDrawer() { document.getElementById('drawer-overlay').style.display = 'block'; setTimeout(() => document.getElementById('drawer-overlay').style.opacity = 1, 10); document.getElementById('drawer').style.left = '0'; }
        function closeDrawer() { document.getElementById('drawer-overlay').style.opacity = 0; document.getElementById('drawer').style.left = '-280px'; setTimeout(() => document.getElementById('drawer-overlay').style.display = 'none', 300); }
        function getMyLocation() {
            if (!navigator.geolocation) { alert("位置情報が利用できません"); return; }
            if(!isMapView) toggleView();
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude; const lng = pos.coords.longitude;
                map.setView([lat, lng], 15);
                L.marker([lat, lng], { icon: L.divIcon({ className: 'my-loc', html: '<div style="background:var(--primary); width:16px; height:16px; border:3px solid white; border-radius:50%; box-shadow:0 0 5px rgba(0,0,0,0.4);"></div>' }) }).addTo(map).bindPopup("現在地").openPopup();
            });
        }
        function openImageModal(src) { document.getElementById('modal-img').src = src; document.getElementById('image-modal').style.display = 'flex'; }
        function useMockData() {
            const mock = [{ id:1, name:"サンプル店", lat:33.8844, lng:130.8744, category:"サンプル", description:"データ読み込みエラー", tel:"", hours:"", url:"", image:"", coupon_imgs:"", coupon_urls:"" }];
            initData(mock);
        }
    </script>
</body>
</html>
